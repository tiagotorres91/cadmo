name: links
# The method preaches mechanical enforcement — the method's own repo gets it too.
# A broken link in the docs is a failed promise; CI catches it before a reader does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # weekly: external links rot on their own
jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Excludes: cadmo.dev (not pointed yet — roadmap item) · npmjs.com (403 to non-browser
          # clients) · img.shields.io (decorative badges, generated on-demand, prone to 408 timeouts).
          # All false positives — decorative or bot-hostile, not documentation integrity. Everything else strict.
          args: --no-progress --include-fragments --max-retries 4 --retry-wait-time 3 --exclude 'cadmo\.dev' --exclude 'npmjs\.com' --exclude 'shields\.io' './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
